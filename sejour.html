<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre séjour · La Bécassière</title>
<meta name="description" content="Guide d'accueil des voyageurs de La Bécassière — wifi, accès, piscine, équipements et bonnes adresses.">
<!-- Page privée réservée aux voyageurs : non indexée -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2a21; --green:#2f4734; --green-deep:#1c2c21; --green-soft:#46604e;
  --bone:#f3efe6; --bone-2:#e8e1d3; --card:#faf7f0; --brass:#b08a46; --brass-soft:#c9a967;
  --tomette:#a8553a; --line:rgba(27,42,33,.14); --shadow:0 18px 50px -22px rgba(28,44,33,.45);
  --maxw:720px; --serif:"Fraunces",Georgia,serif; --sans:"Mulish",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:var(--sans);color:var(--ink);background:var(--bone);line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--green);text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* Header */
header{background:var(--green-deep);color:var(--bone);padding:34px 0 28px;text-align:center}
header .eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--brass-soft)}
header h1{font-family:var(--serif);font-weight:500;font-size:2.1rem;line-height:1.05;margin:.35rem 0 .3rem;letter-spacing:-.01em}
header p{font-size:.95rem;color:rgba(243,239,230,.82)}

/* Quick nav */
.quicknav{position:sticky;top:0;z-index:50;background:rgba(243,239,230,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.quicknav .wrap{display:flex;gap:6px;padding:10px 20px}
.quicknav a{font-size:.8rem;font-weight:600;color:var(--green);padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;flex:0 0 auto}
.quicknav a:active{background:var(--green);color:var(--bone)}

/* Essentials grid */
.ess{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0 8px}
.ess .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
.ess .card .lbl{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);display:block;margin-bottom:5px}
.ess .card .val{font-size:1rem;font-weight:600;color:var(--green-deep)}
.ess .card .val small{display:block;font-weight:400;font-size:.82rem;color:var(--green-soft);margin-top:2px}
.ess .card.wide{grid-column:1 / -1}
.ess .card .code{font-family:var(--serif);font-size:1.15rem;color:var(--tomette);letter-spacing:.02em}

/* Sections */
section{padding:26px 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:none}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);display:inline-flex;align-items:center;gap:.55em}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--brass);display:inline-block}
h2{font-family:var(--serif);font-weight:500;font-size:1.55rem;line-height:1.12;color:var(--green-deep);margin:.4rem 0 .9rem;letter-spacing:-.01em}
h3{font-family:var(--serif);font-weight:500;font-size:1.1rem;color:var(--green);margin:1.1rem 0 .4rem}
p{margin:0 0 .75rem;color:var(--ink)}
.lead{font-size:1.02rem;color:var(--green-soft)}
ul{list-style:none;margin:.2rem 0 .8rem}
ul li{position:relative;padding:4px 0 4px 20px;color:var(--ink)}
ul li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--brass)}
strong{color:var(--green-deep);font-weight:700}
.note{background:var(--card);border-left:3px solid var(--brass);border-radius:0 12px 12px 0;padding:12px 15px;margin:.5rem 0 .9rem;font-size:.92rem}
.note b{color:var(--brass)}
.hr-soft{height:1px;background:var(--line);border:0;margin:1rem 0}

/* Emergency + contact */
.contact{background:var(--green-deep);color:var(--bone);border-radius:18px;padding:22px 20px;margin:8px 0}
.contact h2{color:var(--bone)}
.contact a{color:var(--brass-soft);font-weight:600}
.phones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.phones .p{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.phones .p span{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-soft)}
.phones .p b{font-size:1.1rem;color:var(--bone)}
.btn-call{display:inline-block;margin-top:14px;background:var(--brass);color:#2a1e0e;font-weight:700;padding:12px 20px;border-radius:999px}

/* Checklist */
.check li::before{content:"✓";background:none;color:var(--brass);font-weight:700;top:4px;left:0;width:auto;height:auto}
.check li{padding-left:22px}

footer{text-align:center;padding:30px 20px 46px;color:var(--green-soft);font-size:.82rem}
footer .mark{font-family:var(--serif);color:var(--green);font-size:1rem}

.totop{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--green-deep);color:var(--bone);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
.totop.show{opacity:1;pointer-events:auto}
.hero-img{width:100%;height:230px;object-fit:cover;object-position:center 58%;display:block}
.photo{width:100%;border-radius:14px;margin:.4rem 0 1rem;box-shadow:var(--shadow);object-fit:cover;display:block}
figure{margin:0 0 1rem}
figcaption{font-size:.8rem;color:var(--green-soft);text-align:center;margin-top:-.6rem}
.photo.portrait{width:auto;max-width:100%;max-height:68vh;margin-left:auto;margin-right:auto}
.note.stop{border-left-color:var(--tomette);background:#f8efe9}
.note.stop b{color:var(--tomette)}

@media(min-width:560px){header h1{font-size:2.5rem}.ess{grid-template-columns:1fr 1fr 1fr}.ess .card.wide{grid-column:1 / -1}}

  /* ---- Verrou ---- */
  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;background:var(--green-deep)}
  #lock .box{width:100%;max-width:400px;text-align:center;color:var(--bone)}
  #lock .eyebrow{color:var(--brass-soft);justify-content:center}
  #lock h1{font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1.05;margin:.5rem 0 .4rem}
  #lock p{color:rgba(243,239,230,.82);font-size:.95rem;margin:0 auto 1.3rem;max-width:30ch}
  #lock form{display:flex;flex-direction:column;gap:10px}
  #lock input{font-family:var(--sans);font-size:1rem;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:var(--bone);text-align:center}
  #lock input::placeholder{color:rgba(243,239,230,.45)}
  #lock button{font-family:var(--sans);font-weight:700;font-size:1rem;padding:13px 16px;border-radius:999px;border:none;background:var(--brass);color:#2a1e0e;cursor:pointer}
  #lock .err{color:#e9a98f;font-size:.85rem;min-height:1.1em;margin-top:2px}
  #lock .hint{color:rgba(243,239,230,.5);font-size:.78rem;margin-top:14px}
  
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <div class="eyebrow">Genneville · Pays d'Auge</div>
    <h1>La Bécassière</h1>
    <p>Guide de séjour réservé à nos voyageurs. Saisissez le code reçu avec votre réservation.</p>
    <form id="lf">
      <input id="pw" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Code d'accès" aria-label="Code d'accès">
      <button type="submit">Accéder au guide</button>
      <div class="err" id="er"></div>
    </form>
    <div class="hint">Un souci ? Appelez Caroline au 06 10 05 95 57.</div>
  </div>
</div>

  function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
  function d(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);});}
  async function tryUnlock(pw){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(norm(pw)),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
